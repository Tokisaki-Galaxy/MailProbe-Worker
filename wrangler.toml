name = "mailprobe-worker"
main = "src/index.ts"
compatibility_date = "2025-11-17"

# KV 命名空间绑定 (存储探针元数据与触发日志)
[[kv_namespaces]]
binding = "MAILPROBE_KV"
id = "7014ab83fb15433084f0c74ba7199ee7"

# R2 存储桶绑定 (可选：使用 Cloudflare R2 存储)
[[r2_buckets]]
binding = "MAILPROBE_R2"
bucket_name = "mailprobe-r2"

[placement]
mode = "smart"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[vars]
APP_TITLE = "MailProbe 邮件探针"
# 自建高精多源 IP 定位服务 (可选)
IP_PRISM_URL = "https://ip-prism.api.tski.uk"

# 敏感密钥配置项建议通过命令写入 (wrangler secret put <KEY>):
# - DINGTALK_WEBHOOK: 钉钉机器人 Webhook (包含 access_token)
# - DINGTALK_SECRET: 钉钉机器人加签密钥 (SEC开头)
# - MJJ_API_KEY: mjj.today API密钥
# - IP_PRISM_KEY: ip-prism API密钥 (如: tokisaki-galaxy)
